packages:
  - packages/*
  - apps/*

minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - "@agent-ix/*"
  # Security patch needed sooner than the 4h soak: 5.0.8 fixes the high
  # brace-expansion DoS advisories reaching us through @oclif/core.
  - "brace-expansion"

updateConfig:
  ignoreDependencies:
    - typescript
